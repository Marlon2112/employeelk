<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Личный кабинет сотрудника</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<header class="navbar navbar-dark bg-primary p-3">
  <a class="navbar-brand mx-auto" href="#">Employee Office</a>
</header>

<div class="d-flex">
  <!-- Боковая панель -->
  <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width: 250px; height: 100vh;">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
      <span class="fs-4">Меню</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="#personalInfoSection" class="nav-link text-white">Личный кабинет</a>
      </li>
      <li>
        <a href="#vacationSection" class="nav-link text-white">Отпуск</a>
      </li>
      <li>
        <a href="#sickLeaveSection" class="nav-link text-white">Больничный</a>
      </li>
      <li>
        <a href="#adminSection" class="nav-link text-white">Админ панель</a>
      </li>
    </ul>
    <hr>
  </div>

  <!-- Контентная часть -->
  <div class="container-fluid p-4">
    <main>
      <section id="personalInfoSection">
        <div th:replace="personalinfo :: content"></div>
      </section>

      <section id="vacationSection" style="display: none;">
        <div th:replace="vacation :: content"></div>
      </section>

      <section id="sickLeaveSection" style="display: none;">
        <div th:replace="sickleave :: content"></div>
      </section>

      <section id="adminSection" style="display: none;">
        <div th:replace="admin :: content"></div>
      </section>
    </main>
  </div>
</div>

<footer class="text-center mt-4">
  <p>&copy; 2025 Employee Office</p>
</footer>

<script th:src="@{/js/navigation.js}"></script>
</body>
</html>
