<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Личный кабинет</title>
  <script>
    // Пример обновления страницы через определённый интервал (каждые 30 секунд)
    setInterval(function(){
      location.reload();
    }, 30000);
  </script>
</head>
<body>
<h2>Личный кабинет</h2>
<div th:if="${error}" class="message error" th:text="${error}"></div>
<div th:if="${employee}">
  <p><strong>ФИО:</strong> <span th:text="${employee.fullName}"></span></p>
  <p><strong>Email:</strong> <span th:text="${employee.email}"></span></p>
  <p><strong>Зарплата:</strong> <span th:text="${salary != null ? salary.amount : 'N/A'}"></span></p>
  <h3>Дополнительные часы/смены:</h3>
  <ul>
    <li th:each="wt : ${workingTimes}" th:text="'Доп часы: ' + ${wt.extraHours}"></li>
  </ul>
</div>
</body>
</html>
