<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h2>Панель администратора</h2>
<h3>Добавить сотрудника</h3>
<form th:action="@{/admin/addEmployee}" method="post">
    <label for="fullName">ФИО:</label>
    <input type="text" name="fullName" required/>

    <label for="email">Email:</label>
    <input type="email" name="email" required/>

    <button type="submit">Добавить</button>
</form>

<h3>Список сотрудников</h3>
<table>
    <tr>
        <th>ID</th>
        <th>ФИО</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.fullName}"></td>
        <td th:text="${employee.email}"></td>
        <td>
            <form th:action="@{/admin/updateSalary}" method="post">
                <input type="hidden" name="employeeId" th:value="${employee.id}"/>
                <input type="number" name="amount" step="0.01" placeholder="Зарплата" required/>
                <button type="submit">Обновить зарплату</button>
            </form>
            <form th:action="@{/admin/addExtraHours}" method="post">
                <input type="hidden" name="employeeId" th:value="${employee.id}"/>
                <input type="number" name="extraHours" placeholder="Доп. часы" required/>
                <button type="submit">Добавить часы</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
