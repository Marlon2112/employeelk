services:
  postgres:
    image: postgres:17.2
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty123
      POSTGRES_DB: public
    healthcheck:
      test: pg_isready -U postgres -d qwerty123
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  employeelk:
    build:
      context: backend
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB_NAME: public
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: qwerty123
    depends_on:
      - postgres

  frontend:
    build:
      context: frontend
    restart: "no"
    ports:
      - "3000:80" # Фронтенд, работает на порте 3000 снаружи
    depends_on:
      - employeelk # Фронтенд зависит от бекенда

volumes:
  postgres_data: